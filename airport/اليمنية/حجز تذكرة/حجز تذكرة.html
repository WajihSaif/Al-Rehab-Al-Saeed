<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز تذكرة السفر</title>
    <meta name="keywords" content="حجز تذكرة ,السفر عبر اليمنية">
    <meta name="description" content="عبارة عن صفحة تقوم بعملية إنشاء حجز تذكرة سفر عبر اليمنية للطيران">
    <meta name="author" content="وجيه لطف عبدالله يف"> <link rel="stylesheet" href="حجز تذكرة.css">

    </head>

<body>

    <div class="خلفية">

                <h1>حجز تذكرة</h1>
                <h3>يتم إدخال البيانات حسب جواز السفر</h3>

                <form action="#" id="aticat">
                            <input class="تنسيق" id="Gender" type="text" required placeholder="أدخل الجنس ذكر أو أنثى.." name="sex">
                            <input class="تنسيق" id="Nextname" type="text" required placeholder="أدخل الاسم الثاني....." name="Nextname">
                            <input class="تنسيق" id="Name" type="text" required placeholder="أدخل الاسم الاول.... " name="Name"><br><br>

                            <input class="تنسيق" id="begin_card" type="text" required placeholder="أدخل تاريخ الاصدار..." name="begin_card">
                            <input class="تنسيق" id="place_card" type="text" required placeholder="أدخل جهة الاصدار..." name="place__card">
                            <input class="تنسيق" id="Number_card" type="text" required placeholder="أدخل رقم جواز السفر..." name="card"><br><br>

                            <input class="تنسيق" type="password" id="agin_password" placeholder="أدخل تأكيد كلمة مرور...." name="agin_password">
                            <input class="تنسيق" type="password" id="password" placeholder="أدخل كلمة مرور حسابك.." name="password">
                            <input class="تنسيق" id="Email" type="email" required placeholder="أدخل البريد الالكتروني..." name="Email"><br><br>

                            <input class="تنسيق" id="this_place" type="text" required placeholder="أدخل البلد السفر منه.." name="this">
                            <input class="تنسيق" id="visa_type" type="text" required placeholder="أدخل نوع الفيزاء عمل علاج.." name="visa">
                            <input class="تنسيق" id="Date_born" type="text" required placeholder="أدخل تاريخ ميلادك" name="date"><br><br>

                            <input class="تنسيق" id="port_arr" type="text" required placeholder="أدخل المطار المراد السفر إليه .." name="pport">
                            <input class="تنسيق" id="port_go" type="text" required placeholder="أدخل المطار المراد السفر منه.." name="port">
                            <input class="تنسيق" id="thos_place" type="text" required placeholder="أدخل البلد السفر إليه.." name="thos"><br><br>

                            <input class="تنسيق" id="number_phone" type="text" required placeholder="رقم الهاتف مع المفتاح الدولي..." name="number_phone">
                            <input class="تنسيق" id="visa_card" type="text" required placeholder="أدخل بطاقة الفيزاء كاد.." name="visa_card">
                            <input class="تنسيق" id="Date_go" type="text" required placeholder="أدخل التارخ المراد السفر فيه..." name="Date_go"><br><br>

                            <select class="تنسيق" id="aticket_type">
                                <option value="">إختر نوع الحجز.....</option> <option value="حساب شخصي">حساب شخصي</option>
                                <option value="فرع الرئسي صنعاء /محلي">فرع الرئسي صنعاء /محلي</option>
                                <option value="فرع مطار تعز الدولي/محلي">فرع مطار تعز الدولي/محلي</option>
                                <option value="فرع مطار الحديدة الدولي/محلي">فرع مطار الحديدة الدولي/محلي</option>
                                <option value="فرع مطار عدن الدولي/محلي">فرع مطار عدن الدولي/محلي</option>
                                <option value="فرع مطار المكلا الدولي/محلي">فرع مطار المكلا الدولي/محلي</option>
                                <option value="فرع مطار سيئون الدولي/محلي">فرع مطار سيئون الدولي/محلي</option>
                                <option value="مكتب جدة الرياض الدمام/السعودية">مكتب جدة الرياض الدمام/السعودية</option>
                                <option value="مكتب دبي أبوظبي /الامارات">مكتب دبي أبوظبي /الامارات</option>
                                <option value="مكتب القاهرة /مصر">مكتب القاهرة /مصر</option>
                                <option value="مكتب الكويت/الكويت">مكتب الكويت/الكويت</option>
                                <option value="مكتب مسقط/عمان">مكتب مسقط/عمان</option>
                                <option value="مكتب الخرطوم /السودان">مكتب الخرطوم /السودان</option>
                                <option value="مكتب بومباي دلهي /الهند">مكتب بومباي دلهي /الهند</option>
                            </select><br><br>


                        <!-- <span>pasaport: <input  class="تزين" type="file" id="File_card"  accept=".image/*" ></span>-->



                            <br><br><br>
                            <button type="submit" class="تنسيق">موافق</button>
                            <button type="reset" class="تنسيق">حذف</button>

                </form>


    </div>

    <script src="../../جافا سكريبت/mainjava.js"></script>

</body>

</html>

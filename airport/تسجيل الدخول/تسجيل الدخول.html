<!DOCTYPE html>
<html lang="ar">

<head>
            <meta charset="UTF-8">
            <title>تسجيل الدخول</title>
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <meta name="description" content="عبارة عن صفحة تسجيل الدخول للحساب">
            <meta name="keywords" content="LOGIN,تسجيل الدخول,إنشاء حساب">
            <meta name="author" content="وجيه لطف عبدالله سيف">
            <link href="image/icon.jpg" type="image/x-icon" rel="icon">
            <link rel="stylesheet" href="تسجيل الدخول.css">
</head>

<body>
    <div class="شكل">
            <h1>تسجيل الدخول</h1>

            <form class="تسجيل" onsubmit="check(event)" id="loginFormCheck">

                        <label for="NAME">اسم المستخدم:</label><br>
                        <input class="مربع" id="NAME" type="text" required placeholder="أدخل اسم المستخدم...." name="ok"><br>

                        <label for="EMAIL">البريد الإلكتروني:</label><br>
                        <input class="مربع" id="EMAIL" type="email" required placeholder="أدخل بريدك الإلكتروني...." name="okk"><br>

                        <label for="PASSWORD">كلمة المرور:</label><br>
                        <input class="مربع" id="PASSWORD" type="password" required placeholder="أدخل كلمة المرور...." name="okkk"><br>

                        <button class="مربع" type="submit" id="موافق">موافق</button>
                        <button class="مربع" type="reset" id="حذف">حذف</button><br> <br><br>

            </form>

    </div>

<script src="../جافا سكريبت/mainjava.js"></script>

</body>

</html>
